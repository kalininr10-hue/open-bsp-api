name: R10 Chip Tuning Training

on:
  workflow_dispatch:
  push:
    branches: [main, r10/chiptuning-training]
    paths:
      - "r10/instructions/**"
      - "r10/scenarios/**"
      - "r10/catalog/**"
      - "scripts/sync-r10-agent.py"
      - "scripts/sync-agent-apikey-from-env.py"
      - "scripts/catalog-eval.py"
      - "scripts/build-sft-catalog-seed.py"
      - ".github/workflows/r10-chiptuning-training.yml"

jobs:
  sync-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Sync instructions to Supabase cloud agent
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
          R10_AGENT_MODEL: gpt-5-mini
        run: python3 scripts/sync-r10-agent.py

      - name: Sync OpenAI api_key to agent (AgentExtra, cloud only)
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SESSION_POOLER_HOST: ${{ vars.SUPABASE_SESSION_POOLER_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/sync-agent-apikey-from-env.py

  validate-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fiction scenario JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("r10/scenarios/fiction-smoke.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["meta"]["fiction_phone"] == "87776543210"
          assert data["meta"]["session_prefix"] == "regression:"
          for c in data["cases"]:
              assert c["session"].startswith("regression:")
          print("OK fiction-smoke.json", len(data["cases"]), "cases")
          PY

  catalog-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Catalog-wide matcher regression
        run: python3 scripts/catalog-eval.py
      - name: Build SFT catalog seed (artifact)
        run: python3 scripts/build-sft-catalog-seed.py
