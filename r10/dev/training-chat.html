<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R10 Chip Tuning — Training Chat</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a2332;
        --accent: #e85d04;
        --text: #e7ecf3;
        --muted: #8b98a8;
        --user: #1f3a5f;
        --bot: #243024;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .shell {
        width: min(480px, 100%);
        height: min(720px, 92vh);
        background: var(--panel);
        border: 1px solid #2a3648;
        border-radius: 16px;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        overflow: hidden;
      }
      header {
        padding: 14px 16px;
        border-bottom: 1px solid #2a3648;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      #log {
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 88%;
        padding: 10px 12px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot);
      }
      .msg.system {
        align-self: center;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #2a3648;
      }
      input, button {
        font: inherit;
      }
      input {
        border: 1px solid #2a3648;
        background: #0f1419;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
      }
      button {
        border: 0;
        background: var(--accent);
        color: white;
        border-radius: 10px;
        padding: 0 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      footer {
        padding: 8px 12px 12px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid #2a3648;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>R10 Chip Tuning — Training</h1>
        <p>Cloud sandbox · fiction · без WhatsApp</p>
      </header>
      <div id="log"></div>
      <form id="form">
        <input id="input" autocomplete="off" placeholder="Напишите как клиент…" />
        <button type="submit">→</button>
      </form>
      <footer id="status">Загрузка истории…</footer>
    </div>
    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const status = document.getElementById("status");
      let busy = false;

      function addMsg(role, text) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      async function loadHistory() {
        const res = await fetch("/api/history");
        const data = await res.json();
        log.innerHTML = "";
        if (!data.messages?.length) {
          addMsg("system", "Начните диалог — например: «Чип тюнинг»");
        } else {
          for (const m of data.messages) addMsg(m.role, m.text);
        }
        status.textContent = `conversation ${data.conversation_id?.slice(0, 8)}… · cloud training`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true;
        input.value = "";
        form.querySelector("button").disabled = true;
        addMsg("user", text);
        status.textContent = "Бот думает…";
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          if (data.reply) addMsg("bot", data.reply);
          else addMsg("system", "Нет ответа — проверьте OPENAI_API_KEY в cloud Edge secrets");
        } catch (err) {
          addMsg("system", String(err.message || err));
        } finally {
          busy = false;
          form.querySelector("button").disabled = false;
          status.textContent = "готово";
          input.focus();
        }
      });

      loadHistory().catch((err) => {
        status.textContent = "ошибка загрузки";
        addMsg("system", String(err));
      });
    </script>
  </body>
</html>
